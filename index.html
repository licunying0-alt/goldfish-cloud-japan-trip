重量而非整份计算，购买前确认总价。","交通":"从酒店先逛电电城，再步行约10–15分钟到黑门市场；之后步行约10分钟到难波一带。","避坑与体力提醒":"注意摊位营业时间不一致；部分区域不适合边走边吃，购买后按店家指示用餐。 这里更适合当作“边走边挑”的午前小吃站，而不是必须坐下吃一顿正餐。两个人可以各选一两样分着吃，把胃留给难波的正餐。"},{"name":"道顿堀格力高广告牌","meta":"大阪 · 景点","source":"我的攻略","status":"历史收藏线索，原始小红书链接待逐条匹配","区域/日期":"难波 / 12月17日","历史备注":"未提供原帖内容","介绍":"大阪最具辨识度的夜间餐饮街区，霓虹招牌与戎桥适合拍照。","具体玩法":"可以选择章鱼烧、拉面或烧肉作为晚餐；主街游客较多，不必每家都排队。 夜景拍照建议从戎桥看格力高跑者，再下到运河步道拍霓虹倒影。餐饮密集但游客也多，遇到热门店长队可以改吃旁边街区。","交通":"从心斋桥筋商店街南端步行约8–12分钟；返回酒店可步行约20–30分钟。","避坑与体力提醒":"热门餐厅晚餐排队较长，预算和菜单最好在进店前确认。 冬季天黑较早，傍晚开始便适合拍夜景。拍完可以顺着河边走，避开主街最拥挤的人流。"},{"name":"法善寺横丁","meta":"大阪 · 景点","source":"我的攻略","status":"历史收藏线索，原始小红书链接待逐条匹配","区域/日期":"难波 / 12月17日（候选）","历史备注":"未提供原帖内容","介绍":"大阪 · 难波游览地点：法善寺横丁。适合按地理位置与同区景点串联。","具体玩法":"建议先确认入口与最佳游览方向，优先完成想拍的画面，再慢慢逛周边。先核对当天开放、售票、预约和拍摄限制；冬季日落早，室外取景尽量安排在白天。","交通":"建议从「酒店（恵美須町）」打开地图查询公共交通或步行路线。若位于难波、心斋桥、道顿堀一带，可优先比较步行时间。","避坑与体力提醒":"热门地点选择早到或避开正午人潮；留意阶梯、坡道及拥挤路段。"},{"name":"通天阁","meta":"大阪 · 景点","source":"我的攻略","status":"历史收藏线索，原始小红书链接待逐条匹配","区域/日期":"新世界 / 12月17日（候选）","历史备注":"未提供原帖内容","介绍":"大阪 · 新世界游览地点：通天阁。适合按地理位置与同区景点串联。","具体玩法":"建议先确认入口与最佳游览方向，优先完成想拍的画面，再慢慢逛周边。先核对当天开放、售票、预约和拍摄限制；冬季日落早，室外取景尽量安排在白天。","交通":"建议从「酒店（恵美須町）」打开地图查询公共交通或步行路线。若位于难波、心斋桥、道顿堀一带，可优先比较步行时间。","避坑与体力提醒":"热门地点选择早到或避开正午人潮；留意阶梯、坡道及拥挤路段。"},{"name":"新世界商店街","meta":"大阪 · 景点","source":"我的攻略","status":"历史收藏线索，原始小红书链接待逐条匹配","区域/日期":"新世界 / 12月17日（候选）","历史备注":"未提供原帖内容","介绍":"大阪 · 新世界游览地点：新世界商店街。适合按地理位置与同区景点串联。","具体玩法":"建议先确认入口与最佳游览方向，优先完成想拍的画面，再慢慢逛周边。先核对当天开放、售票、预约和拍摄限制；冬季日落早，室外取景尽量安排在白天。","交通":"建议从「酒店（恵美須町）」打开地图查询公共交通或步行路线。若位于难波、心斋桥、道顿堀一带，可优先比较步行时间。","避坑与体力提醒":"热门地点选择早到或避开正午人潮；留意阶梯、坡道及拥挤路段。"},{"name":"日本环球影城 USJ","meta":"大阪 · 景点","source":"我的攻略","status":"历史收藏线索，原始小红书链接待逐条匹配","区域/日期":"环球影城 / 12月18日","历史备注":"未提供原帖内容","介绍":"大阪 · 环球影城游览地点：日本环球影城 USJ。适合按地理位置与同区景点串联。","具体玩法":"建议先确认入口与最佳游览方向，优先完成想拍的画面，再慢慢逛周边。先核对当天开放、售票、预约和拍摄限制；冬季日落早，室外取景尽量安排在白天。","交通":"建议从「酒店（恵美須町）」打开地图查询公共交通或步行路线。若位于难波、心斋桥、道顿堀一带，可优先比较步行时间。","避坑与体力提醒":"热门地点选择早到或避开正午人潮；留意阶梯、坡道及拥挤路段。"},{"name":"超级任天堂世界","meta":"大阪 · 景点","s let libraryAdded=JSON.parse(safeStorage.getItem('jy_full_added')||'{}');let libraryDates=JSON.parse(safeStorage.getItem('jy_v31_library_dates')||'{}');let packByPerson=JSON.parse(safeStorage.getItem('jy_v31_pack_people')||'{}');let packingPerson='金鱼';
function region(r){let t=JSON.stringify(r);return /京都|祇园|清水寺|河原町|嵐山|岚山/.test(t)?'京都':'大阪'}
function classify(r){let t=(r.name||'')+' '+(r.meta||'')+' '+(r['分类']||'');if(/和服|着物|浴衣/.test(t))return '和服';if(/USJ|环球影城|任天堂|哈利波特/.test(t))return 'USJ';if(/交通|电车|地铁|机场|南海|车站/.test(t))return '交通';if(/酒店|住宿|Hotel|HOTEL/.test(t))return '住宿';if(/动漫|电电城|巡礼|模型|手办/.test(t))return '动漫巡礼';if(/购物|商店|百货|药妆|商场/.test(t))return '购物';if(/景点|寺|神社|公园|道顿堀|街道|景观/.test(t))return '景点';return '美食'}
function summary(r){return String(r['历史备注']||r['说明']||r['备注']||r.meta||'点击查看原始收藏记录').slice(0,130)}
function ehtml(v){return String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function setLC(c){libraryCategory=c;libraryPage=0;render()}
function setLS(v){librarySearch=v;libraryPage=0;render();let el=document.getElementById('libSearch');if(el){el.focus();el.setSelectionRange(v.length,v.length)}}
function showLib(i){libraryDetail=i;libraryReturn=screen;go('libraryDetail')}
function libToggle(i,kind){let obj=kind==='fav'?libraryFav:libraryAdded;obj[i]=!obj[i];safeStorage.setItem(kind==='fav'?'jy_full_fav':'jy_full_added',JSON.stringify(obj));render()}
function libraryPageUI(){return heading('FULL COLLECTION','攻略收藏馆',`${libraryPlaces.length} 条原始记录 · 分类搜索`,'金鱼_拍照')+libraryListingUI()}
function libraryDetailUI(){let p=libraryPlaces[libraryDetail];if(!p)return libraryPageUI();let keys=Object.keys(p.raw).filter(k=>!['name','photo','image','image_url','photoCredit','photoSource'].includes(k)&&p.raw[k]!==null&&p.raw[k]!==''&&typeof p.raw[k]!=='object');let preferred=['介绍','具体玩法','交通','避坑与体力提醒','历史备注','区域/日期','分类','status'];keys.sort((a,b)=>(preferred.indexOf(a)<0?99:preferred.indexOf(a))-(preferred.indexOf(b)<0?99:preferred.indexOf(b)));return `<div class="row">${btn('‹ 返回攻略',"go(libraryReturn==='daydetail'?'daydetail':'discover')")}<span class="pill">${p.cat}</span></div><div class="detail-art">${catimg(p.cat).replace('class="tiny"','style="width:112px;height:112px"')}</div><div class="eyebrow">${p.city} · 历史收藏资料</div><div class="title">${ehtml(p.name)}</div><div class="card">${keys.map(k=>`<div class="rawline"><b>${ehtml(k)}</b><p>${ehtml(p.raw[k])}</p></div>`).join('')}</div><div class="twobuttons"><button class="action" onclick="libToggle(${p.index},'fav')">${libraryFav[p.index]?'取消收藏':'收藏地点'}</button><button class="action light" onclick="libToggle(${p.index},'added')">${libraryAdded[p.index]?'取消待安排':'加入待安排'}</button></div><div class="card"><h3>安排到哪一天？</h3><select class="field" onchange="assignLibDay(${p.index},this.value)"><option value="" ${libraryDates[p.index]===undefined?'selected':''}>暂不安排</option>${days.map((d,i)=>`<option value="${i}" ${libraryDates[p.index]===i?'selected':''}>${d.date} · ${d.label}</option>`).join('')}</select><p class="muted">选择后会出现在对应日期的行程末尾，可以随时修改。</p></div><button class="action full" onclick="maps(${JSON.stringify(p.name)})">打开地图查找</button><p class="footerhint">历史资料中的未核实地址、店名和来源保留原始标记。</p>`}
function assignLibDay(i,v){if(v==='')delete libraryDates[i];else libraryDates[i]=Number(v);safeStorage.setItem('jy_v31_library_dates',JSON.stringify(libraryDates));render()}
function go(s){screen=s;render();document.getElementById('content').scrollTop=0}function openPlace(i,from='discover'){detail=i;backScreen=from;go('detail')}function nav(){const items=[['home','首页'],['itinerary','行程'],['discover','发现'],['checklist','清单']];document.getElementById('nav').innerHTML=items.map(([s,n])=>`<button class="${screen===s||((screen==='detail'||screen==='library'||screen==='libraryDetail')&&s==='discover')||(screen==='daydetail'&&s==='itinerary')||(['tools','budget','currency','kimono','favs'].includes(screen)&&s==='checklist')?'active':''}" onclick="go('${s}')">${img('02_底部导航',n)}<span>${n}</span></button>`).join('')}
function heading(k,title,desc,avatar){return `<div class="top"><div><div class="eyebrow">${k}</div><div class="title">${title}</div><div class="sub">${desc}</div></div>${avatar?person(avatar,'avatar'):''}</div>`}
function home(){return heading('GOLDFISH × CLOUD','我们的日本之旅','大阪 · 京都　｜　2026.12.16–12.21','金鱼云朵_双人头像')+`<div class="hero"><div class="row"><span class="pill">六天五晚 · 旅行手账</span></div><h2>和你一起，去收集冬日的小小快乐。</h2>${btn('查看六天行程　↗',"go('itinerary')",'action')}<div class="herochar">${person('金鱼云朵_一起旅行','herochar')}</div></div><div class="section"><strong>旅程速览</strong>${btn('完整行程 →',"go('itinerary')")}</div><div class="card tap" onclick="day=1;go('daydetail')"><div class="row"><span class="date">DAY 2 · 12月17日</span><span class="muted">大阪</span></div><h3>日本桥 → 黑门市场 → 心斋桥 → 道顿堀</h3><p>逛吃、动漫和夜景都安排上了　›</p></div><div class="section"><strong>常用入口</strong><span class="muted">轻一点，但不减少功能</span></div><div class="mini-grid">${[['美食','美食'],['景点','景点'],['和服','和服'],['USJ','USJ']].map(([c,n])=>`<button class="mini-tile" onclick="category='${c}';go('discover')">${catimg(n)}${c}</button>`).join('')}</div><div class="section"><strong>旅行工具</strong>${btn('查看全部 →',"go('tools')")}</div><div class="card tap place" onclick="go('tools')"><div class="placeicon">${deco('行李箱')}</div><div class="grow"><h3>预算、汇率、备忘录、路线</h3><p>工具集中管理，首页不堆按钮</p></div><span>›</span></div><div class="footerhint">✿ 金鱼与云朵的小小旅行手账</div>`}
function itinerary(){return heading('OUR JOURNEY','六天行程','日期横向切换 · 点击进入当天完整路线','云朵_看地图')+`<div class="daystrip">${days.map((d,i)=>`<button class="daybtn ${i===day?'active':''}" onclick="day=${i};render()"><b>${i+16}</b><span>12月</span></button>`).join('')}</div><div class="card tap" onclick="go('daydetail')"><div class="row"><span class="date">DAY ${day+1} · ${days[day].date}</span><span class="pill">${days[day].area}</span></div><h3 style="font-size:20px">${days[day].label}</h3><p>${days[day].stops.length} 个行程节点 · 点击查看交通、时间与攻略</p></div><div class="section"><strong>当天路线</strong>${btn('详细安排 →',"go('daydetail')")}</div><div class="timeline">${days[day].stops.map((s,j)=>`<div class="stop"><div class="card tap" onclick="go('daydetail')"><div class="row"><span class="date">${s[0]}</span><span class="muted">${s[3]}</span></div><h3>${s[1]}</h3><p>${s[2]}</p></div></div>`).join('')}</div><div class="card tap place" onclick="go('tools')"><div class="placeicon">${catimg('交通')}</div><div class="grow"><h3>交通与地图工具</h3><p>路线入口归入行程，不再占底栏</p></div>›</div>`}
function daydetail(){let d=days[day];return `<div class="row">${btn('‹ 返回行程',"go('itinerary')")}<span class="pill">DAY ${day+1}</span></div>${heading('DAY BY DAY',d.label,`${d.date} · ${d.area} · 具体时间以实际安排为准`,'金鱼_看地图')}<div class="timeline">${d.stops.map(s=>`<div class="stop"><div class="card"><div class="row"><span class="date">${s[0]}</span><span class="pill">${s[3]}</span></div><h3>${s[1]}</h3><p>${s[2]}</p><div class="twobuttons" style="margin-bottom:0"><button onclick="maps('${s[1]}')">⌁ 地图导航</button><button onclick="findPlace('${s[1]}')">查看攻略 ›</button></div></div></div>`).join('')}</div><div class="section"><strong>自行加入的攻略</strong></div>${libraryPlaces.filter(p=>libraryDates[p.index]===day).map(p=>`<div class="card tap place" onclick="showLib(${p.index})"><div class="placeicon">${catimg(p.cat)}</div><div class="grow"><h3>${ehtml(p.name)}</h3><p>${ehtml(p.summary)}</p></div><span>›</span></div>`).join('')||'<div class="card"><p>尚未加入其他地点。可以在发现页面选择具体日期。</p></div>'}<div class="card"><h3>行程设计原则</h3><p>路线信息在这里集中展开，主页卡片只保留摘要。实际换乘、营业时间与预约需要出发前复核。</p></div>`}
function discover(){return heading('EXPLORE','发现好去处','193条原始攻略 · 八大分类 · 全文搜索','金鱼_拍照')+libraryListingUI()}
function libraryListingUI(){let cats=['全部','美食','景点','购物','和服','USJ','动漫巡礼','交通','住宿'];let q=librarySearch.trim().toLowerCase();let filtered=libraryPlaces.filter(p=>(libraryCategory==='全部'||p.cat===libraryCategory)&&(!q||(p.name+' '+p.summary+' '+JSON.stringify(p.raw)).toLowerCase().includes(q)));let max=Math.max(0,Math.ceil(filtered.length/20)-1);libraryPage=Math.min(libraryPage,max);let subset=filtered.slice(libraryPage*20,libraryPage*20+20);return `<div class="search">${img('04_操作按钮','搜索')}<input id="libSearch" placeholder="搜索店铺、景点、攻略正文" value="${ehtml(librarySearch)}" oninput="setLS(this.value)"></div><div class="cats">${cats.map(c=>`<button class="cat ${libraryCategory===c?'active':''}" onclick="setLC('${c}')">${c==='全部'?deco('樱花'):catimg(c)}<span>${c}</span></button>`).join('')}</div><div class="section"><strong>${libraryCategory==='全部'?'全部攻略':libraryCategory} · ${filtered.length} 条</strong></div>${subset.map(p=>`<div class="card tap place" onclick="showLib(${p.index})"><div class="placeicon">${catimg(p.cat)}</div><div class="grow"><div class="row"><span class="date">${p.city} · ${p.cat}</span><span class="muted">${libraryDates[p.index]!==undefined?'已安排 '+['12.16','12.17','12.18','12.19','12.20','12.21'][libraryDates[p.index]]:libraryFav[p.index]?'已收藏':''}</span></div><h3>${ehtml(p.name)}</h3><p>${ehtml(p.summary)}</p></div><span style="color:#b0a4a0">›</span></div>`).join('')||'<div class="card">没有匹配的记录</div>'}<div class="row pager"><button class="link" ${libraryPage===0?'disabled':''} onclick="libraryPage--;render()">上一页</button><span class="muted">${libraryPage+1} / ${max+1}</span><button class="link" ${libraryPage>=max?'disabled':''} onclick="libraryPage++;render()">下一页</button></div>`}
function placeRows(filtered){return filtered.length?filtered.map(({p,i})=>`<div class="card tap place" onclick="openPlace(${i})"><div class="placeicon">${catimg(p[2])}</div><div class="grow"><div class="row"><span class="date">${p[2]}</span><span class="muted">${saved['fav'+i]?'已收藏':''}</span></div><h3>${p[0]}</h3><p>${p[1]}</p></div><span style="color:#b0a4a0">›</span></div>`).join(''):`<div class="card"><p>暂时没有符合条件的攻略，试试其他关键词。</p></div>`}function refreshResults(){document.getElementById('results').innerHTML=placeRows(places.map((p,i)=>({p,i})).filter(({p})=>(category==='全部'||p[2]===category)&&(!search||p.join(' ').toLowerCase().includes(search.toLowerCase()))))}
function detailPage(){let p=places[detail]||places[0],match=libraryPlaces.find(x=>x.name===p[0]||x.name.includes(p[0])||p[0].includes(x.name));if(match){libraryDetail=match.index;return libraryDetailUI()}return `<div class="row">${btn('‹ 返回发现',"go('discover')")}</div><div class="detail-art">${catimg(p[2])}</div><div class="title">${ehtml(p[0])}</div><div class="card"><h3>行程地点信息</h3><p>${ehtml(p[3])}</p><p>这条精选路线地点暂无一一对应的完整历史卡片；可通过攻略收藏馆继续搜索。</p></div><button class="action full" onclick="maps(${JSON.stringify(p[0])})">地图查找</button>`}
const pack=['护照与旅行证件','机票与酒店订单','手机、充电器与充电宝','日元现金及支付方式','保暖外套、围巾','常用药品与个人用品','USJ 预约与入园凭证'];const before=['确认航班与机场航站楼','核对和服预约及归还时间','查看 USJ 入园安排','确认境外网络与支付','检查天气与交通'];function checklist(){return heading('READY TO GO','旅行清单','双人打包 · 出发检查 · 预算与备忘录','云朵_开心')+`<div class="seg"><button class="${listTab==='行李'?'active':''}" onclick="listTab='行李';render()">行李</button><button class="${listTab==='出发前'?'active':''}" onclick="listTab='出发前';render()">出发前</button><button class="${listTab==='工具'?'active':''}" onclick="listTab='工具';go('tools')">更多工具</button></div><div class="section"><strong>${listTab==='行李'?'双人独立行李清单':'出发前确认'}</strong><span class="muted">本机保存</span></div>${listTab==='行李'?`<div class="seg">${['金鱼','云朵'].map(n=>`<button class="${packingPerson===n?'active':''}" onclick="packingPerson='${n}';render()">${n}</button>`).join('')}</div>`:''}${(listTab==='行李'?pack:before).map((v,i)=>{let key=listTab==='行李'?packingPerson+i:listTab+i;let checked=listTab==='行李'?!!packByPerson[key]:!!saved[key];return `<label class="check ${checked?'done':''}"><input type="checkbox" ${checked?'checked':''} onchange="togglePacking('${key}',this.checked,${listTab==='行李'})"><span>${v}</span></label>`}).join('')}<div class="section"><strong>其他旅行工具</strong>${btn('查看全部 →',"go('tools')")}</div><div class="mini-grid">${[['预算','行李箱','budget'],['备忘录','相机','tools'],['路线','富士山','tools'],['收藏','爱心','favs']].map(([n,ic,to])=>`<button class="mini-tile" onclick="go('${to}')">${deco(ic)}${n}</button>`).join('')}</div>`}
function togglePacking(key,val,isPerson){if(isPerson){packByPerson[key]=val;safeStorage.setItem('jy_v31_pack_people',JSON.stringify(packByPerson))}else{saved[key]=val;persist()}render()}
function budgetUI(){let total=expenses.reduce((a,e)=>a+(Number(e.amount)||0),0);return `<div class="row">${btn('‹ 返回工具',"go('tools')")}</div>${heading('BUDGET','旅行记账','本机保存 · 日元与人民币分开记账','金鱼_喝茶')}<div class="card"><h3>已记录支出</h3><div class="big">人民币 ¥ ${expenses.filter(x=>x.currency==='CNY').reduce((a,x)=>a+Number(x.amount),0).toFixed(2)}</div><p>日元 ¥ ${expenses.filter(x=>x.currency==='JPY').reduce((a,x)=>a+Number(x.amount),0).toLocaleString('zh-CN')} · 不自动混算不同币种</p></div><div class="card"><h3>添加一笔支出</h3><label class="fieldlabel">项目名称</label><input id="exname" class="field" placeholder="例如：晚餐、地铁票"><div class="twobuttons"><div><label class="fieldlabel">金额</label><input id="examount" class="field" type="number" min="0" step="0.01" placeholder="0"></div><div><label class="fieldlabel">币种</label><select id="excurrency" class="field"><option value="JPY">JPY 日元</option><option value="CNY">CNY 人民币</option></select></div></div><label class="fieldlabel">类别</label><select id="excategory" class="field"><option>餐饮</option><option>交通</option><option>购物</option><option>住宿</option><option>门票</option><option>其他</option></select><button class="action full" onclick="addExpense()">保存这笔支出</button></div><div class="section"><strong>支出记录</strong><span class="muted">${expenses.length} 笔</span></div>${expenses.length?expenses.slice().reverse().map((e,reverseI)=>`<div class="card"><div class="row"><b>${ehtml(e.name)}</b><strong>${e.currency==='JPY'?'¥':'¥'} ${Number(e.amount).toLocaleString('zh-CN')} ${e.currency}</strong></div><p>${ehtml(e.category)} · ${ehtml(e.date)}</p><button class="link" onclick="removeExpense(${expenses.length-1-reverseI})">删除记录</button></div>`).join(''):'<div class="card"><p>还没有支出记录，旅途开始后可以逐笔添加。</p></div>'}`}
function addExpense(){let n=document.getElementById('exname').value.trim(),a=Number(document.getElementById('examount').value);if(!n||!Number.isFinite(a)||a<=0){alert('请输入项目名称和大于零的金额');return}expenses.push({name:n,amount:a,currency:document.getElementById('excurrency').value,category:document.getElementById('excategory').value,date:new Date().toLocaleDateString('zh-CN')});safeStorage.setItem('jy_v31_expenses',JSON.stringify(expenses));render()}
function removeExpense(i){if(!confirm('删除这笔支出？'))return;expenses.splice(i,1);safeStorage.setItem('jy_v31_expenses',JSON.stringify(expenses));render()}
function currencyUI(){return `<div class="row">${btn('‹ 返回工具',"go('tools')")}</div>${heading('EXCHANGE','汇率换算','手动输入参考汇率 · 不冒充实时行情','云朵_看地图')}<div class="card"><label class="fieldlabel">100 日元约等于多少人民币？</label><input class="field" id="fxrate" type="number" step="0.0001" min="0" value="${fxRate}" oninput="fxRate=Number(this.value)||0;safeStorage.setItem('jy_v31_rate',fxRate);updateFx()"><p>请从银行或可信行情渠道查到最新汇率后填入。</p><label class="fieldlabel">日元金额（JPY）</label><input class="field" id="fxamount" type="number" min="0" value="1000" oninput="updateFx()"><div class="big" id="fxout">人民币约 ¥ ${(1000*fxRate/100).toFixed(2)}</div><p>仅供估算，刷卡、换汇手续费与实际结算汇率可能不同。</p></div>`}
function updateFx(){let el=document.getElementById('fxout'),v=Number(document.getElementById('fxamount').value)||0;if(el)el.textContent='人民币约 ¥ '+(v*fxRate/100).toFixed(2)}
function kimonoUI(){let ks=[['冈本和服','岡本 / Okamoto'],['梨花和服','梨花和服'],['MOCOMOCO','MOCOMOCO'],['Oukakimono','Oukakimono'],['Ookini','Ookini'],['Okimono屋','Okimono'],['Kirari','Kirari'],['Nagomi','Nagomi']];return `<div class="row">${btn('‹ 返回工具',"go('tools')")}</div>${heading('KIMONO','京都和服租赁比较','八家备选 · 比较位置、套餐与归还要求','云朵_开心')}<div class="card"><h3>选店时优先核对</h3><p>是否靠近清水寺或祇园、发型是否另收费、是否支持跨店归还、最晚归还时间、冬季保暖与鞋子舒适度。价格和营业状态以店铺当日公告为准。</p></div>${ks.map(([cn,jp],i)=>`<div class="card"><div class="row"><h3>${cn}</h3><span class="pill">备选 ${i+1}</span></div><p>${jp} · 具体分店与套餐待核实</p><div class="twobuttons"><button onclick="maps(${JSON.stringify(cn+' Kyoto kimono rental')})">地图查找</button><button onclick="kimonoSave(${i})">${kimonoFav.includes(i)?'已加入比较':'加入比较'}</button></div></div>`).join('')}`}
function kimonoSave(i){kimonoFav=kimonoFav.includes(i)?kimonoFav.filter(x=>x!==i):[...kimonoFav,i];safeStorage.setItem('jy_v31_kimono',JSON.stringify(kimonoFav));render()}
function tools(){return `<div class="row">${btn('‹ 返回清单',"go('checklist')")}<span class="pill">旅行工具箱</span></div>${heading('ALL IN ONE','旅行工具箱','预算 · 汇率 · 备忘录 · 地图 · 和服比较','金鱼_喝茶')}<div class="section"><strong>实用工具</strong></div>${[['预算与记账','记录实际支出，人民币与日元分开统计','行李箱','budget'],['汇率换算','输入参考汇率，离线计算','富士山','currency'],['京都和服比较','八家租赁店备选资料','樱花','kimono'],['我的收藏','查看收藏的攻略地点','爱心','favs']].map(([t,sub,ic,route])=>`<div class="menu" onclick="go('${route}')">${deco(ic)}<div class="grow"><b>${t}</b><p>${sub}</p></div>›</div>`).join('')}<div class="section"><strong>旅行备忘录</strong><span class="muted">本机自动保存</span></div><textarea class="note" placeholder="记录订单、注意事项、购物愿望…" oninput="notes=this.value;safeStorage.setItem('jy_demo_notes',notes)">${esc(notes)}</textarea><div class="section"><strong>地图与交通</strong></div><div class="card"><p>酒店：ANCHORED by RIHGA Osaka Namba</p><button class="action full" onclick="maps('ANCHORED by RIHGA Osaka Namba')">在 Google Maps 查看酒店</button></div>`}
